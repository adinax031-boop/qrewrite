[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qrewrite"
version = "0.1.0"
description = "Auditable quantum circuit rewriting and numerical verification"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
test = ["numpy>=1.24"]

[project.scripts]
qrewrite = "qrewrite:main"
qrewrite-compile = "compiler:main"

[tool.setuptools]
py-modules = ["qrewrite", "compiler"]
